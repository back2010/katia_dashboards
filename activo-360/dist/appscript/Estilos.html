<style>
/* Layout: barra superior con fecha + navegación lateral (Activo 360 / Humand) + área de trabajo */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f2f6f4; --line:#d9e2dd; --fg:#16231c; --muted:#5d6e65;
  --sd:#0b7a48; --sd-ink:#ffffff; --sd-soft:#dff1e7; --amber:#f2a516; --amber-soft:#fdf0d3;
  --hm:#c2185b; --hm-soft:#fbe4ee; --hm-ink:#ffffff;
  --ok:#1f8a4c; --ok-soft:#e1f4e8; --warn:#b26a00; --warn-soft:#fff0d6; --bad:#c0392b; --bad-soft:#fde5e1; --info:#2b5fb3; --info-soft:#e3ecfb; --ti:#1f4e8c; --ti-soft:#e6eef8;
  --f-ui: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-num: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  --r:10px;color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:8px 16px;background:#fff;color:var(--fg);border-bottom:3px solid var(--sd);box-shadow:0 2px 10px rgba(11,122,72,.06)}
.brand img{height:68px;width:auto;display:block}
.brand b{color:var(--sd)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand b{font-size:17px;letter-spacing:.2px}
.brand span{opacity:.85;font-size:12.5px}
.clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clock .d{font-family:var(--f-num);background:var(--sd-soft);color:var(--sd);padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600}
.clock button{background:var(--surface);border:1px solid var(--line);color:var(--fg);padding:4px 10px;border-radius:6px;font-size:12.5px}
.clock button:hover{background:var(--surface2)}
.adm{position:relative}.adm>div{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30}.adm>div button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px}.adm>div button:hover{background:var(--surface2)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 52px)}
nav{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
nav h6{margin:12px 8px 4px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
nav h6.hm{color:var(--hm)}
nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--fg)}
nav button:hover{background:var(--surface2)}
nav button.on{background:var(--sd-soft);color:var(--sd);font-weight:600}
nav button.hmb.on{background:var(--hm-soft);color:var(--hm)}
.cnt{font-family:var(--f-num);font-size:11px;min-width:20px;text-align:center;padding:1px 6px;border-radius:10px;background:var(--surface2);color:var(--muted)}
.cnt.hot{background:var(--hm);color:var(--hm-ink)}
main{padding:20px 16px 60px;min-width:0}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px}
.btn:hover{background:var(--surface2)}
.btn.p{background:var(--sd);border-color:var(--sd);color:var(--sd-ink);font-weight:600}
.btn.h{background:var(--hm);border-color:var(--hm);color:var(--hm-ink);font-weight:600}
.btn.o{border-color:var(--hm);color:var(--hm);background:transparent}
.btn.r{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;background:var(--surface2);position:sticky;top:0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-num);font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}.p-hm{background:var(--hm-soft);color:var(--hm)}.p-mut{background:var(--surface2);color:var(--muted)}.p-sd{background:var(--sd-soft);color:var(--sd)}
.note{font-size:12.5px;color:var(--muted)}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--amber-soft);border:1px solid var(--amber);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner b{color:var(--warn)}
/* stepper */
.steps{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding:4px 0}
.st{flex:1 0 86px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;font-size:11px;color:var(--muted);min-width:86px}
.st i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;z-index:1}
.st::before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line)}
.st:first-child::before{display:none}
.st.done i{background:var(--sd);border-color:var(--sd);color:var(--sd-ink)}
.st.done::before,.st.cur::before{background:var(--sd)}
.st.cur i{border-color:var(--hm);color:var(--hm);box-shadow:0 0 0 4px var(--hm-soft)}
.st.cur{color:var(--hm);font-weight:600}
.st span{margin-top:5px;line-height:1.2}
.mini{display:flex;gap:3px}
.mini b{width:14px;height:6px;border-radius:3px;background:var(--line)}
.mini b.d{background:var(--sd)}.mini b.c{background:var(--hm)}
/* Humand mock */
.hm-frame{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hm-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hm-logo{font-weight:800;color:var(--sd);font-size:18px;letter-spacing:-.3px}
.hm-logo small{display:block;font-size:9px;font-weight:600;color:var(--amber);letter-spacing:.4px}
.hm-tag{font-size:11px;color:var(--hm);border:1px dashed var(--hm);padding:2px 8px;border-radius:999px}
.hm-body{padding:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--fg);border-bottom:3px solid transparent}
.tabs button.on{color:var(--hm);border-color:var(--hm);background:var(--hm-soft);border-radius:8px 8px 0 0}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.type{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px}
.type.on{border-color:var(--hm);box-shadow:0 0 0 2px var(--hm-soft)}
.type .big{font-size:26px;font-weight:700;color:var(--hm);font-family:var(--f-num)}
.type .who{font-size:12px;color:var(--muted)}
.bazar-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center;padding:12px 18px;border-bottom:4px solid var(--amber)}
.bazar-hero h2{font-size:38px;line-height:1;color:var(--sd);font-weight:900;letter-spacing:-1px}
.pc-art{aspect-ratio:16/10;width:min(100%,220px);justify-self:center;border-radius:50%;background:var(--amber-soft);display:grid;place-items:center}
.pc-art div{width:56%;aspect-ratio:16/10;background:var(--sd);border-radius:8px;border:6px solid var(--sd-soft);position:relative}
.pc-art div::after{content:"";position:absolute;left:30%;right:30%;bottom:-22%;height:16%;background:var(--sd);border-radius:0 0 6px 6px}
.hl{background:#3ccf73;color:#fff;font-weight:700;padding:1px 4px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.prod{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.prod .price{font-size:22px;font-weight:700;font-family:var(--f-num)}
.prod .was{text-decoration:line-through;color:var(--muted);font-size:12px;font-family:var(--f-num)}
.spec{font-size:12.5px;color:var(--muted)}
.post{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;background:var(--surface)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sd);color:var(--sd-ink);display:grid;place-items:center;font-weight:700;flex:none}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .lb{font-size:12px;font-weight:600;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg label{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px;cursor:pointer;color:var(--fg);font-weight:400}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--sd-soft);border-color:var(--sd);color:var(--sd);font-weight:600}
.result{border-radius:var(--r);padding:14px;border:2px solid var(--sd);background:var(--sd-soft)}
.result.bad{border-color:var(--bad);background:var(--bad-soft)}
.result .pr{font-family:var(--f-num);font-size:26px;font-weight:700}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;background:var(--surface2)}
.drop.over{border-color:var(--sd);background:var(--sd-soft)}
pre{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:11.5px;margin:6px 0 0;font-family:var(--f-num)}
.log{display:flex;flex-direction:column;gap:8px}
.logi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.meth{font-family:var(--f-num);font-weight:700;font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--info-soft);color:var(--info)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.tl li{display:grid;grid-template-columns:96px 14px minmax(0,1fr);gap:8px;font-size:12.5px;padding-bottom:10px}
.tl li .dot{width:10px;height:10px;border-radius:50%;background:var(--sd);margin-top:4px}
.tl li.rem .dot{background:var(--amber)}
.tl li.hmn .dot{background:var(--hm)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;justify-content:flex-end}
.drawer>div{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:calc(100% - 32px);font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 50px;gap:8px;align-items:center;font-size:12.5px}
.bar .t{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar .t div{height:100%;background:var(--sd)}
.bar .t div.hm{background:var(--hm)}
.bar .t div.am{background:var(--amber)}
svg text{fill:var(--muted);font-family:var(--f-ui)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.flow span{padding:5px 9px;border-radius:7px;background:var(--surface2);border:1px solid var(--line)}
.flow span.h{background:var(--hm-soft);border-color:var(--hm);color:var(--hm);font-weight:600}
.flow span.g{background:#E8F0FE;border-color:#1A73E8;color:#1A5FC8;font-weight:600}
.flow em{font-style:normal;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
details summary{cursor:pointer;font-weight:600}
@media (max-width:820px){.shell{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav h6{display:none}nav button{flex:none}.bazar-hero{grid-template-columns:1fr}.bar{grid-template-columns:110px minmax(0,1fr) 44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge svg{width:100%;max-width:300px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.stack div{height:100%}
.prod.frozen{opacity:.72;background:var(--surface2)}
.prod.frozen .price{color:var(--muted)}
.carta{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px 26px;font-size:13px;line-height:1.55;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.carta h3{text-align:center;font-size:14px;letter-spacing:.6px;text-transform:uppercase}
.carta .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--muted);margin:6px 0 14px}
.firma{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:22px}
.firma div{border-top:1px solid var(--fg);padding-top:6px;text-align:center;font-size:12px}
.sig{font-family:"Segoe Script","Brush Script MT",cursive;font-size:20px;color:var(--info);border:0!important;padding:0!important;min-height:30px}
.prof{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prof .avatar{width:54px;height:54px;font-size:18px}
@media print{body.printing *{visibility:hidden!important}body.printing #expdoc,body.printing #expdoc *{visibility:visible!important}body.printing #expdoc{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none}body.printing .drawer{position:static;background:none}}
#expdoc table{width:100%;border-collapse:collapse;font-size:12px}#expdoc th,#expdoc td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}#expdoc th{background:var(--surface2);position:static}
.ver{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}

.mods{display:flex;gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;flex:0 1 auto;margin-right:auto}
.mods button{border:0;background:none;border-radius:9px;padding:6px 14px;text-align:left;display:flex;flex-direction:column;line-height:1.2;color:var(--muted)}
.mods button b{font-size:13.5px}.mods small{font-size:11px;color:var(--muted);font-weight:400}
.mods button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);color:var(--sd)}
.mods button[data-modulo=ti].on{color:var(--ti)}
body.mod-ti .top{border-bottom-color:var(--ti);box-shadow:0 2px 10px rgba(31,78,140,.08)}
body.mod-ti nav button.on{background:var(--ti-soft);color:var(--ti)}
body.mod-ti nav h6.mt{color:var(--ti)}
nav h6.mv{color:var(--sd)}
.modtag{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;border-radius:10px;background:var(--sd-soft);border-left:5px solid var(--sd);font-size:12.5px;color:var(--fg)}
.modtag b{color:var(--sd);letter-spacing:.3px}
body.mod-ti .modtag{background:var(--ti-soft);border-left-color:var(--ti)}body.mod-ti .modtag b{color:var(--ti)}
.sgc{width:100%;border-collapse:collapse;font-size:12px;color:#222}.sgc td{border:1px solid #333;padding:4px 8px;vertical-align:middle}
.sgc .lg{white-space:nowrap;font:800 20px var(--f-ui);color:#7d8b93;letter-spacing:-.3px}.sgc .lg small{display:block;font:400 10px var(--f-ui);color:#7d8b93}
.sgc .ttl{text-align:center;font-weight:700}
.sgc .fm{text-align:center;font-weight:800;letter-spacing:.4px}
.cdat{display:grid;grid-template-columns:150px 1fr;gap:2px 10px;margin:12px 0 6px 20px}.cdat b{text-align:right}
.carta h4{text-align:center;margin:10px 0 4px;font-size:14px}
.ctab{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}.ctab th{background:#d9d9d9;border:1px solid #333;padding:5px;text-align:center}.ctab td{border:1px solid #333;padding:5px;text-align:center}
.carta .cl{text-indent:32px;text-align:justify;margin:8px 0}
.sgc,.ctab{table-layout:fixed}.sgc td,.ctab td,.ctab th{overflow-wrap:anywhere}
@media (max-width:700px){.carta{padding:16px 12px}.sgc,.ctab{font-size:10px}.sgc .lg{font-size:15px}.mods small{display:none}.mods{width:100%}.mods button{flex:1}.cdat{grid-template-columns:110px 1fr;margin-left:0}}
body.mod-ti .btn.p{background:var(--ti);border-color:var(--ti);color:#fff}body.mod-ti .prof .avatar{background:var(--ti)}body.mod-ti .kpi .v[style*='--sd']{color:var(--ti)!important}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1411; --surface:#151d19; --surface2:#1c2621; --line:#2b3a32; --fg:#e3ebe6; --muted:#9aaba2;
  --sd:#3fbf7f; --sd-ink:#06210f; --sd-soft:#123324; --amber:#f2b33d; --amber-soft:#3a2d10;
  --hm:#ec5f93; --hm-soft:#3a1527; --hm-ink:#1a0610;
  --ok:#4cc27d; --ok-soft:#14301f; --warn:#f0a43a; --warn-soft:#3a2a0e; --bad:#ff7a6b; --bad-soft:#3d1a16; --info:#7fa9f0; --info-soft:#17243b; --ti:#7aa6ea; --ti-soft:#162438; --ti-ink:#0a1626;
  color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0e1411; --surface:#151d19; --surface2:#1c2621; --line:#2b3a32; --fg:#e3ebe6; --muted:#9aaba2;
  --sd:#3fbf7f; --sd-ink:#06210f; --sd-soft:#123324; --amber:#f2b33d; --amber-soft:#3a2d10;
  --hm:#ec5f93; --hm-soft:#3a1527; --hm-ink:#1a0610;
  --ok:#4cc27d; --ok-soft:#14301f; --warn:#f0a43a; --warn-soft:#3a2a0e; --bad:#ff7a6b; --bad-soft:#3d1a16; --info:#7fa9f0; --info-soft:#17243b; --ti:#7aa6ea; --ti-soft:#162438; --ti-ink:#0a1626;
  color-scheme:dark;}
:root{--ti-ink:#ffffff}
body{background:var(--bg)}
.top{background:var(--surface)!important}
.mods button.on{background:var(--surface)!important}
.flow span.g{background:var(--info-soft)!important;border-color:var(--info)!important;color:var(--info)!important}
.brand img{background:#fff;border-radius:8px;padding:2px 4px}
main svg text{fill:var(--muted)}
.carta{color:#16231c}
.carta .note{color:#5d6e65}
body.mod-ti .btn.p{color:var(--ti-ink)!important}
.thm{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
